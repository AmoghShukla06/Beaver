[package]
name = "beaver"
version = "2.0.1"
edition = "2021"
description = "Beaver network security monitor (desktop shell)"
license = "Apache-2.0"
repository = "https://github.com/AmoghShukla06/Beaver"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"
sha2 = "0.11"

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8"
png = "0.18"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem"] }

[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "4"
