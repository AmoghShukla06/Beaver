[package]
name = "beaver-service"
version = "2.0.1"
edition = "2021"
description = "Beaver network monitoring service (sockets, threat intelligence, risk engine, firewall control)"
license = "Apache-2.0"
repository = "https://github.com/AmoghShukla06/Beaver"
publish = false

[dependencies]
flate2 = "1"
libloading = "0.9.0"
log = "0.4"
maxminddb = { version = "0.32.0", features = ["mmap"] }
netstat2 = "0.11.2"
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sysinfo = { version = "0.39.6", default-features = false, features = ["system", "network"] }
ureq = "3.5.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_NetworkManagement_Dns", "Win32_Foundation", "Win32_UI_Shell", "Win32_System_Threading", "Win32_System_Power", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
