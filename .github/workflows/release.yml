name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build and publish, e.g. v2.0.0
        required: true
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu 22.04 keeps the binaries compatible with older glibc (Debian 12, Ubuntu 22.04+).
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - run: npm run test:service
      - name: Package
        run: npm run tauri:build
      - uses: actions/upload-artifact@v4
        with:
          name: beaver-${{ runner.os }}
          path: |
            target/release/bundle/nsis/*-setup.exe
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # The in-app updater downloads the -setup.exe and refuses it unless its hash matches this file.
      - name: Checksums
        # Artifacts keep their bundle/<format>/ folders; flatten them first.
        run: |
          find dist -mindepth 2 -type f -exec mv -t dist {} +
          find dist -mindepth 1 -type d -delete
          cd dist && sha256sum *.exe *.AppImage *.deb > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Release notes
        run: |
          awk '/^## /{n++} n==1' CHANGELOG.md > notes.md
          cat >> notes.md <<'NOTES'

          ## Downloads
          | Platform | File |
          |---|---|
          | Windows 10/11 x64 | `Beaver_*_x64-setup.exe` |
          | Debian / Ubuntu x64 | `Beaver_*_amd64.deb` |
          | Any Linux x64 | `Beaver_*_amd64.AppImage` |

          Builds are not code-signed yet; Windows SmartScreen may warn ("More info → Run anyway"). Verify files with `SHA256SUMS.txt`.
          Optional: [Npcap](https://npcap.com/) on Windows or `libpcap` on Linux for per-app speeds and DNS domains.
          NOTES
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Beaver ${{ inputs.tag || github.ref_name }}
          body_path: notes.md
          files: dist/*
          fail_on_unmatched_files: true
