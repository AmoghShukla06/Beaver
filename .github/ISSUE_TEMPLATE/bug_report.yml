name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Settings → About → Copy diagnostics, then paste here. Usernames and IP addresses are already redacted.
      render: markdown
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install Beaver?
      options: [Windows installer, Linux .deb, Linux AppImage, From source]
    validations:
      required: true
